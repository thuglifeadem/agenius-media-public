name: Encode reels

on:
  push:
    branches: [main]
    paths: ['**.reel.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encode
  cancel-in-progress: false

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Encode
        run: python3 tools/encode.py
      - name: Commit results
        run: |
          git config user.name "agenius-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A '*.mp4' '*.error.txt' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Encode reels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
